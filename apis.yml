name: Bright Health
description: 'Bright Health Group was a Minneapolis-based healthtech and health-insurance company founded
  in 2016 by former UnitedHealthcare CEO Bob Sheehy, offering individual, family, and Medicare Advantage
  plans on the ACA exchanges through its Bright HealthCare brand. Backed by Redpoint Ventures and other
  venture investors, the company went public in 2021, then exited the insurance business, rebranded to
  NeueHealth in January 2024 to focus on value-based care delivery (NeueCare) and provider enablement
  (NeueSolutions), and shut down all remaining Bright HealthCare health-plan operations effective
  December 31, 2024. NeueHealth was subsequently taken private by New Enterprise Associates. Bright Health
  never published a public developer program, API, or documentation surface; runout operations are handled
  under the NeueHealth corporate brand.'
